<!doctype html>
<html lang="en" data-resolution="landscape" data-composition-variables='[{"id": "color-ground", "type": "color", "label": "Ground", "default": "#141414"}, {"id": "color-ink", "type": "color", "label": "Text", "default": "#f2f2f2"}, {"id": "color-muted", "type": "color", "label": "Muted text", "default": "#a6a6a6"}, {"id": "color-well", "type": "color", "label": "Recessed panel", "default": "#1a1a1a"}, {"id": "color-accent", "type": "color", "label": "Accent (lime)", "default": "#d6f58e"}, {"id": "color-lime-ink", "type": "color", "label": "Text on light fields", "default": "#131313"}, {"id": "color-negative", "type": "color", "label": "Slashed red", "default": "#ff6a5c"}, {"id": "color-warning", "type": "color", "label": "Not verified amber", "default": "#f3c25b"}, {"id": "color-tile-white", "type": "color", "label": "Tile white", "default": "#f3f3f0"}, {"id": "color-tile-grey", "type": "color", "label": "Tile grey", "default": "#d2d2d2"}, {"id": "label", "type": "string", "label": "Label", "default": "Slash tx"}, {"id": "value", "type": "string", "label": "Value", "default": "abfa5a43\u2026"}, {"id": "tone", "type": "enum", "label": "Tone", "default": "negative", "options": [{"value": "lime", "label": "Good (lime)"}, {"value": "negative", "label": "Slashed / rejected (red)"}]}, {"id": "x", "type": "number", "label": "Box left (px)", "default": 660, "min": 0, "max": 1920, "unit": "px"}, {"id": "y", "type": "number", "label": "Box top (px)", "default": 470, "min": 0, "max": 1080, "unit": "px"}, {"id": "w", "type": "number", "label": "Box width (px)", "default": 600, "min": 40, "max": 1920, "unit": "px"}, {"id": "h", "type": "number", "label": "Box height (px)", "default": 90, "min": 20, "max": 1080, "unit": "px"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Middlemate · M5 Callout</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The app's palette (docs/design.md); the variables above override these in Studio. */
      :root { --color-ground: #141414; --color-ink: #f2f2f2; --color-muted: #a6a6a6; --color-well: #1a1a1a; --color-accent: #d6f58e; --color-lime-ink: #131313; --color-negative: #ff6a5c; --color-warning: #f3c25b; --color-tile-white: #f3f3f0; --color-tile-grey: #d2d2d2; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { width: 100%; height: 100%; }
      @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url('assets/fonts/BarlowCondensed-700.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow'; font-weight: 400; src: url('assets/fonts/Barlow-400.woff2') format('woff2'); }
      @font-face { font-family: 'Barlow'; font-weight: 600; src: url('assets/fonts/Barlow-600.woff2') format('woff2'); }
      @font-face { font-family: 'Geist Mono'; font-weight: 500; src: url('assets/fonts/GeistMono-500.woff2') format('woff2'); }
      #m5-box { position: absolute; }
      #m5-tag { position: absolute; display: flex; align-items: baseline; gap: 18px; padding: 12px 22px; color: #131313; }
      #m5-label { font: 600 36px 'Barlow', sans-serif; }
      #m5-value { font: 500 36px 'Geist Mono', monospace; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="m5" data-start="0" data-duration="3" data-width="1920" data-height="1080">


      <div id="m5-box" class="clip" data-start="0" data-duration="3"></div>
      <div id="m5-tag" class="clip" data-start="0" data-duration="3"><span id="m5-label"></span><span id="m5-value"></span></div>
    </div>
    <script>
      // A box draws itself around a spot in the screen recording, then a tag says what it is. Transparent ground: render as MOV.
      const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const get = (k, d) => (v[k] === undefined || v[k] === '' ? d : v[k]);
      const ink = get('tone', 'negative') === 'lime' ? '#d6f58e' : '#ff6a5c';
      const x = Number(get('x', 660)), y = Number(get('y', 470)), w = Number(get('w', 600)), h = Number(get('h', 90));
      Object.assign(document.querySelector('#m5-box').style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', boxShadow: 'inset 0 0 0 6px ' + ink });
      Object.assign(document.querySelector('#m5-tag').style, { left: x + 'px', top: (y + h + 14) + 'px', background: ink });
      document.querySelector('#m5-label').textContent = get('label', 'Slash tx');
      document.querySelector('#m5-value').textContent = get('value', 'abfa5a43…');
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#m5-box', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.3, ease: 'expo.out' }, 0.1);
      tl.fromTo('#m5-tag', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.15, ease: 'power4.out' }, 0.32);
      tl.to(['#m5-box', '#m5-tag'], { opacity: 0, filter: 'blur(6px)', duration: 0.18, ease: 'power3.in' }, 2.75);
      window.__timelines["m5"] = tl;
    </script>
  </body>
</html>
