  <script>
    const tl = gsap.timeline({ paused: true });
    const HIT = 1.5, DRAIN = 1.2;
    const num = document.querySelector('#m4-num');
    // the counter is a pure function of time: drains, accelerating into the hit

      const p = Math.min(1, Math.max(0, (tl.time() - (HIT - DRAIN)) / DRAIN));
      num.textContent = (5 * (1 - p * p)).toFixed(2);
