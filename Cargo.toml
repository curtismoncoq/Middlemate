[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.dependencies]
soroban-sdk = "=28.0.0"
stellar-access = "=0.8.0"
stellar-contract-utils = "=0.8.0"
stellar-macros = "=0.8.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
